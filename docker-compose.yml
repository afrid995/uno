services:
  postgres:
    image: postgres:16-alpine
    container_name: uno-ultimate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: uno_ultimate
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d uno_ultimate"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: uno_ultimate_pgdata
